{% extends "base.html" %}
{% block title %}用户管理{% endblock %}
{% block content %}
<h2 class="mb-4">用户管理</h2>

<!-- 添加用户模态框 -->
<div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title">新建用户</h5>
        <form id="createUserForm" class="row g-3">
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="用户名" required name="username">
            </div>
            <div class="col-md-3">
                <input type="password" class="form-control" placeholder="密码" required name="password">
            </div>
            <div class="col-md-3">
                <select class="form-select" name="role">
                    <option value="checker">检票员</option>
                    <option value="admin">管理员</option>
                </select>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">添加用户</button>
            </div>
        </form>
    </div>
</div>

<!-- 用户列表 -->
<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>用户名</th>
                <th>角色</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>
                    <span class="badge bg-{% if user.role == 'admin' %}danger{% else %}info{% endif %}">
                        {{ user.role }}
                    </span>
                </td>
                <td>
                    {% if current_user.id != user.id %}
                    <button class="btn btn-sm btn-danger" onclick="deleteUser({{ user.id }})">删除</button>
                    {% else %}
                    <span class="text-muted">当前登录账号</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    document.getElementById('createUserForm').addEventListener('submit', function (e) {
        e.preventDefault();
        fetch('/admin/create_user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: this.username.value,
                password: this.password.value,
                role: this.role.value
            })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('创建成功');
                    window.location.reload();
                } else {
                    alert(data.error);
                }
            });
    });

    function deleteUser(userId) {
        if (!confirm('确定要删除该用户吗？')) return;

        fetch(`/admin/delete_user/${userId}`, {
            method: 'POST'
        })
            .then(response => response.json())
            .then(() => window.location.reload());
    }
</script>
{% endblock %}
